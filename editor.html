<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Maze Game — Editor de Tema</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --bg-2: #050505;
        --panel: #151515;
        --panel-2: #1d1d1d;
        --line: #333333;
        --accent: #ffcc00;
        --accent-ink: #1a1300;
        --brand: #9a9a9a;
        --text: #f0f0f0;
        --muted: #9a9a9a;
        --focus: #bcbcbc;
        --ok: #36d27a;
        --tap: 46px;
        --header-h: 64px;
        --radius: 12px;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background:
          radial-gradient(1100px 560px at 100% -10%, rgba(255, 255, 255, 0.05), transparent 60%),
          var(--bg);
        color: var(--text);
        min-height: 100vh;
        min-height: 100dvh;
        touch-action: manipulation;
      }

      /* ---- Top bar -------------------------------------------------------- */
      header.topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px clamp(14px, 3vw, 28px);
        min-height: var(--header-h);
        background: rgb(28, 28, 30);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .brand h1 {
        font-size: clamp(16px, 2.2vw, 20px);
        margin: 0;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-weight: 700;
        /* Cinza do padrao preto/cinza (mesmo tom da headline do jogo), nao branco. */
        color: #bbbbbb;
      }
      .brand .sub { color: var(--muted); font-size: 12px; margin: 2px 0 0; }
      .top-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

      /* ---- Buttons -------------------------------------------------------- */
      button, .filebtn {
        font: inherit;
        border-radius: 10px;
        padding: 11px 15px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        min-height: var(--tap);
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid transparent;
        white-space: nowrap;
      }
      .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
      .primary:hover { filter: brightness(1.06); }
      .ghost { background: rgba(255, 255, 255, 0.03); color: var(--text); border-color: var(--line); font-weight: 600; }
      .ghost:hover { background: rgba(255, 255, 255, 0.07); }
      .filebtn { position: relative; overflow: hidden; }
      .filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
      button.small { padding: 7px 11px; font-size: 12px; min-height: 0; border-radius: 8px; }

      /* ---- Layout (coluna única centrada — padrão dos editores dos 3 jogos;
              sem prévia embutida: "Testar jogo" abre o jogo real) ----------- */
      .layout {
        max-width: 860px;
        margin: 0 auto;
        padding: clamp(14px, 2.4vw, 26px);
      }
      #form { min-width: 0; }
      .lead-note, .sub-lead { color: var(--muted); font-size: 13px; line-height: 1.5; }
      .hint { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 0; }

      /* ---- Sections (accordion cards) ------------------------------------ */
      details {
        background: linear-gradient(180deg, var(--panel-2), var(--panel));
        border: 1px solid var(--line);
        border-radius: var(--radius);
        margin-bottom: 12px;
        padding: 2px 16px;
      }
      details[open] { padding-bottom: 12px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); }
      summary {
        cursor: pointer;
        font-weight: 700;
        padding: 15px 0;
        user-select: none;
        font-size: 15px;
        min-height: var(--tap);
        display: flex;
        align-items: center;
        gap: 10px;
        list-style: none;
      }
      summary::-webkit-details-marker { display: none; }
      summary::before { content: "▸"; color: var(--brand); transition: transform 0.15s; }
      details[open] > summary::before { transform: rotate(90deg); }

      .row {
        display: grid;
        grid-template-columns: 170px 1fr;
        align-items: center;
        gap: 12px;
        margin: 11px 0;
      }
      .row label { color: var(--muted); font-size: 13px; }
      input[type='text'], input[type='number'], select {
        background: var(--bg-2);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 9px;
        padding: 11px 12px;
        font-size: 16px; /* >=16px evita zoom automatico no mobile */
        width: 100%;
        min-height: var(--tap);
      }
      input:focus, select:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.18); }
      input[type='color'] {
        width: 58px; height: var(--tap); padding: 3px;
        border: 1px solid var(--line); background: var(--bg-2); border-radius: 9px; cursor: pointer;
      }
      input[type='file'] { font-size: 13px; color: var(--muted); max-width: 100%; }
      input[type='checkbox'] { width: 26px; height: 26px; accent-color: var(--brand); }
      .sprite { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .sprite img { width: 46px; height: 46px; object-fit: contain; background: var(--bg-2); border: 1px solid var(--line); border-radius: 9px; }
      .lead-field { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 10px 0; background: rgba(0, 0, 0, 0.15); }
      .lead-field .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

      /* ================= Mobile / tablet-estreito ========================= */
      @media (max-width: 900px) {
        .layout {
          padding: clamp(12px, 4vw, 18px);
          padding-bottom: 84px; /* respiro para a barra de ação fixa */
        }
        .row { grid-template-columns: 1fr; gap: 6px; }
        .lead-field .grid { grid-template-columns: 1fr; }
        /* Ações secundárias do header descem; ação primária vira barra fixa. */
        .top-actions .secondary { display: none; }
        .mobile-bar {
          display: flex;
          position: fixed;
          left: 0; right: 0; bottom: 0;
          z-index: 28;
          gap: 8px;
          padding: 10px clamp(12px, 4vw, 18px);
          padding-bottom: max(10px, env(safe-area-inset-bottom));
          background: rgba(28, 28, 30, 0.94);
          backdrop-filter: blur(10px);
          border-top: 1px solid var(--line);
        }
        .mobile-bar > * { flex: 1; justify-content: center; }
      }
      @media (min-width: 901px) {
        .mobile-bar { display: none; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>Editor de Tema</h1>
        <p class="sub">Monte a marca do totem. Sem código.</p>
      </div>
      <div class="top-actions">
        <button id="apply" class="primary" title="Salva e abre o jogo com este tema">✓ Aplicar e voltar</button>
        <button id="test-game" class="ghost" title="Abre o jogo real com o rascunho atual">▶ Testar jogo</button>
        <button id="save-disk" class="ghost secondary" style="display: none">Salvar no totem</button>
        <button id="reveal-leads" class="ghost secondary" style="display: none">📂 Leads</button>
        <button id="download" class="ghost secondary">Exportar tema</button>
        <label class="filebtn ghost secondary">
          Importar
          <input id="import" type="file" accept="application/json,.json" />
        </label>
      </div>
    </header>

    <main class="layout">
      <section id="form" aria-label="Controles">
        <div id="sections"></div>
        <p class="hint">As imagens são embutidas no <code>theme.json</code> como data-URI — um único arquivo carrega tudo.</p>
      </section>
    </main>

    <div class="mobile-bar">
      <button id="apply-mobile" class="primary" type="button">✓ Aplicar e voltar ao jogo</button>
    </div>

    <script type="module" src="/src/editor/editor.ts"></script>
  </body>
</html>
